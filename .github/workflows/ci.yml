name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (net48 + net8.0-windows)
        run: dotnet build ArkaControls.sln -c Release
      - name: Test
        run: dotnet test tests/ArkaControls.Tests/ArkaControls.Tests.csproj -c Release --no-build
      - name: Pack
        run: dotnet pack src/ArkaControls/ArkaControls.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
